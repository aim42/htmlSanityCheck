permissions:
  contents: read
  pages: write
  id-token: write

name: GitHub Pages

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      perform_step:
        type: boolean
        description: 'Publish GH Page'
        default: false

jobs:
  build-artifacts:
    uses: ./.github/workflows/build-artifacts.yml
    with:
      # SonarQube requires JDK 17 or higher
      java-version: '17'

  pages:
    needs: build-artifacts
    runs-on: ubuntu-latest
    concurrency:
      group: "${{ github.workflow }}-${{ github.ref }}"
    env:
      DTC_HEADLESS: true
    steps:
      - name: Install dot (Graphviz)
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: "${{ runner.os }}-gradle-caches }}"
          restore-keys: ${{ runner.os }}-gradle-caches

      - name: Cache .doctoolchain
        uses: actions/cache@v5
        with:
          path: ~/.doctoolchain
          key: "${{ runner.os }}-doctoolchain }}"
          restore-keys: ${{ runner.os }}-doctoolchain

      - name: Check out
        uses: actions/checkout@v5
        with:
          # Needed for git-versioning to derive the branch-slug-SNAPSHOT version
          # when generate-pages calls `./gradlew -q printVersion`.
          fetch-depth: 0

      - name: Create local branch ref for git-versioning
        # See build-artifacts.yml — without this, git-versioning intermittently falls back
        # to gradle.properties' static version, and generate-pages then asks self-check
        # for the wrong coordinate.
        shell: bash
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [[ -z "$BRANCH" || "$BRANCH" == "HEAD" ]]; then
            echo "::notice::No branch name; leaving git-versioning to its own detection."
            exit 0
          fi
          if [[ -z "$GITHUB_HEAD_REF" && "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::notice::Tag push; leaving git-versioning to its own detection."
            exit 0
          fi
          git update-ref "refs/heads/$BRANCH" HEAD
          echo "::notice::Materialised refs/heads/$BRANCH at $(git rev-parse --short HEAD)"

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          name: build-artifacts
          path: .

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Generate Pages
        run: ./generate-pages

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: public
          retention-days: 7

      - name: Collect state upon failure
        if: failure()
        run: |
          echo "Git:"
          git status
          echo "Env:"
          env
          echo "PWD:"
          pwd
          echo "Files:"
          find * -ls

  publish:
    runs-on: ubuntu-latest
    needs: pages
    if: ${{ github.event.inputs.perform_step }}
    steps:
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}