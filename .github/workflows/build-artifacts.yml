name: Build Artifacts
on:
  workflow_call:
    inputs:
      java-version:
        required: true
        type: string
        default: '17'
      run-sonar:
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: false

env:
  SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION || 'aim42' }}
  SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY || 'aim42_htmlSanityCheck' }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          # git-versioning derives the project version from the current branch;
          # the default fetch-depth: 1 leaves HEAD detached without a branch ref
          # and the plugin falls back to gradle.properties' static version.
          fetch-depth: 0

      - name: Create local branch ref for git-versioning
        # actions/checkout leaves HEAD detached and only creates refs/remotes/origin/<branch>.
        # me.qoomon.git-versioning v6.4.4 sometimes finds the branch via the remote ref and
        # sometimes falls back to the rev clause, producing 2.0.0-rc5 instead of
        # <branch-slug>-SNAPSHOT — non-deterministic across workflow runs on the same SHA.
        # Materialising refs/heads/<branch> ourselves makes detection reliable.
        shell: bash
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [[ -z "$BRANCH" || "$BRANCH" == "HEAD" ]]; then
            echo "::notice::No branch name; leaving git-versioning to its own detection."
            exit 0
          fi
          if [[ -z "$GITHUB_HEAD_REF" && "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::notice::Tag push; leaving git-versioning to its own detection."
            exit 0
          fi
          git update-ref "refs/heads/$BRANCH" HEAD
          echo "::notice::Materialised refs/heads/$BRANCH at $(git rev-parse --short HEAD)"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Cache Gradle Toolchain JDKs
        uses: actions/cache@v4
        with:
          path: ~/.gradle/jdks
          key: "${{ runner.os }}-gradle-jdks"
          restore-keys: ${{ runner.os }}-gradle-jdks

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: "${{ runner.os }}-gradle-caches }}"
          restore-keys: ${{ runner.os }}-gradle-caches

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Execute Gradle build
        run: ./gradlew clean check integrationTest --scan --stacktrace

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        if: ${{ inputs.run-sonar }}
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Analyze with SonarCloud
        if: ${{ inputs.run-sonar }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew sonar -Psonar.branch.name=${GITHUB_REF#refs/heads/} --info --scan

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: |
            **/build

      - name: Collect state upon failure
        if: failure()
        run: |
          echo "Git:"
          git status
          echo "Env:"
          env | sort
          echo "PWD:"
          pwd
          echo "Files:"
          find * -ls
          ./gradlew javaToolchains
