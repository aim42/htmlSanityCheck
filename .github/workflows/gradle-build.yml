permissions:
  checks: write
  pull-requests: write

name: Build and Test
on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      additional_tags:
        description: 'Additional tags for Docker images (comma-separated)'
        required: false
        type: string

jobs:
  build-artifacts:
    uses: ./.github/workflows/build-artifacts.yml
    with:
      # SonarQube requires JDK 17 or higher
      java-version: '17'
      run-sonar: ${{ github.repository == 'aim42/htmlSanityCheck' }}
      push-docker-sha: 'true'
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  test-gh-action:
    needs: build-artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Prepare Docker image for test
        run: |
          tag="${{ github.sha }}"
          docker tag "ghcr.io/aim42/hsc:${tag}" ghcr.io/aim42/hsc:v2

      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          name: build-artifacts
          path: .

      - name: Run GH Action as provided by this repository
        uses: ./
        with:
          args: -r build/gh-action-test-report integration-test/common/build/docs --exclude 'https://www\.baeldung\.com/.*' --fail-on-errors

      - name: Upload GH Action test results
        uses: actions/upload-artifact@v4
        with:
          path: build/gh-action-test-report

      - name: Test Result of GH Action
        run: |
          if test -s build/gh-action-test-report/index.html; then
            echo "Test Successful"
          else
            echo "Test Failed: Report not found" >&2
            exit 1
          fi

      - name: Collect state upon failure
        if: failure()
        run: |
          echo "Git:"
          git status
          echo "Env:"
          env | sort
          echo "PWD:"
          pwd
          echo "Files:"
          find * -ls
          ./gradlew javaToolchains

  post-build:
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          name: build-artifacts
          path: .

      - name: 'Publish Test Results'
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            **/build/test-results/**/*.xml

      - name: JaCoCo Test Coverage Report
        uses: PavanMudigonda/jacoco-reporter@v5.1
        with:
          coverage_results_path: "build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml"
          coverage_report_name: Coverage
          coverage_report_title: JaCoCo
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect state upon failure
        if: failure()
        run: |
          echo "Git:"
          git status
          echo "Env:"
          env | sort
          echo "PWD:"
          pwd
          echo "Files:"
          find * -ls
          ./gradlew javaToolchains

  publish-docker-images:
    needs: test-gh-action
    permissions:
      packages: write
      contents: read
    env:
      DOCKER_USERNAME: ${{ github.repository_owner }}
      DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle Toolchain JDKs
        uses: actions/cache@v4
        with:
          path: ~/.gradle/jdks
          key: "${{ runner.os }}-gradle-jdks"
          restore-keys: ${{ runner.os }}-gradle-jdks

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: "${{ runner.os }}-gradle-caches"
          restore-keys: ${{ runner.os }}-gradle-caches

      - name: Execute Gradle build
        env:
          ADDITIONAL_TAGS: ${{ inputs.additional_tags }}
        run: ./gradlew dockerPush -Ddocker.image.additional.tags="${ADDITIONAL_TAGS}" --scan --stacktrace

      - name: Collect state upon failure
        if: failure()
        run: |
          echo "Maven Repo:"
          (cd $HOME && find .m2 -ls)
          echo "Git:"
          git status
          echo "Env:"
          env | sort
          echo "PWD:"
          pwd
          echo "Files:"
          find * -ls
          ./gradlew javaToolchains